services:
  - type: web
    name: ace-tours-vanuatu
    env: node
    plan: starter # Starter plan recommended for always-on background workers
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Connect Neon DB URL here
      - key: SESSION_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "no-reply@acetoursvanuatu.com"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENTS_STRIPE_MODE
        value: sandbox
