services:
  - type: web
    name: ace-tours-vanuatu
    env: node
    plan: starter # Starter plan recommended for always-on background workers
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Connect Neon DB URL here
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://ace-tours-transfers.onrender.com
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "no-reply@acetours.vu"
      - key: BUSINESS_EMAIL
        value: "info@acetours.vu"
      - key: BUSINESS_PHONE
        value: "+678 7744444"
      - key: WHATSAPP_NUMBER
        value: "6787744444"
      - key: ADMIN_EMAIL
        sync: false # Admin notification email address
      - key: SMS_PROVIDER
        value: console # Change to android_gateway or twilio when ready
      - key: SMS_ADMIN_PHONE
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENTS_STRIPE_MODE
        value: sandbox
