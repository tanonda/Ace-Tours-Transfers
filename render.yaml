services:
  - type: web
    name: ace-tours-vanuatu
    # Docker runtime: the Dockerfile uses the official Playwright image so
    # Chromium + its system libraries are present, which Render's native node
    # runtime can't provide. The build compiles client+server; the SEO prerender
    # runs at container STARTUP (Render only exposes DATABASE_URL at runtime, and
    # prerender needs the DB to read the sitemap). See Dockerfile CMD.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Starter plan recommended for always-on background workers
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Connect Neon DB URL here
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://ace-tours-transfers.onrender.com
      # Build-time var baked into the Vite client (import.meta.env.VITE_APP_URL)
      # for canonical/OG/JSON-LD URLs. Code already defaults to this domain; set
      # explicitly per the SEO deployment guide so canonical links are unambiguous.
      - key: VITE_APP_URL
        value: https://acetoursvanuatu.com
      - key: CLOUDINARY_URL
        sync: false
      # The legacy upload fallback reads the three separate keys; set them too.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "no-reply@acetoursvanuatu.com"
      - key: BUSINESS_EMAIL
        value: "acetoursvanuatu@outlook.com"
      - key: BUSINESS_PHONE
        value: "+678 7114045"
      - key: WHATSAPP_NUMBER
        value: "6787114045"
      - key: ADMIN_EMAIL
        sync: false # Admin notification email address
      - key: SMS_PROVIDER
        value: console # Change to android_gateway or twilio when ready
      - key: SMS_ADMIN_PHONE
        sync: false
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: manual
      - key: PAYMENTS_MANUAL_ENABLED
        value: "true"
      - key: MANUAL_PAYMENT_BANK_TRANSFER
        value: "true"
      - key: MANUAL_PAYMENT_CASH_ON_DELIVERY
        value: "true"
      - key: PAYMENTS_EXTERNAL_DISABLED
        value: "false"
      # Cards stay off until DDD_DISABLE_CARD=false and a bank is enabled.
      - key: DDD_DISABLE_CARD
        value: "true"
      - key: PAYMENTS_ANZ_ENABLED
        value: "false"
      - key: PAYMENTS_BSP_ENABLED
        value: "false"
      - key: PAYMENTS_NBV_ENABLED
        value: "false"
      - key: PAYMENTS_BRED_ENABLED
        value: "false"
      - key: PAYMENTS_STRIPE_ENABLED
        value: "false"
      - key: PAYMENTS_STRIPE_VISIBLE
        value: "false"
      - key: STRIPE_ENABLED
        value: "false"
      - key: VAT_RATE
        value: "0.15"
      - key: LOG_LEVEL
        value: info
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Required to save/open bank gateway credentials (Admin → Payments).
      - key: PAYMENT_CREDENTIALS_KEY
        sync: false
      # Optional: encrypts TOTP secrets (falls back to PAYMENT_CREDENTIALS_KEY).
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Optional monitoring / integrations.
      - key: SENTRY_DSN
        sync: false
      - key: BETTERSTACK_API_KEY
        sync: false
      - key: BETTERSTACK_MONITOR_ID
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_PLACE_ID
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
