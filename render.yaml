services:
  - type: web
    name: ace-tours-vanuatu
    # Docker runtime: the Dockerfile uses the official Playwright image so
    # Chromium + its system libraries are present, which Render's native node
    # runtime can't provide. The build compiles client+server; the SEO prerender
    # runs at container STARTUP (Render only exposes DATABASE_URL at runtime, and
    # prerender needs the DB to read the sitemap). See Dockerfile CMD.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Starter plan recommended for always-on background workers
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Connect Neon DB URL here
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://ace-tours-transfers.onrender.com
      # Build-time var baked into the Vite client (import.meta.env.VITE_APP_URL)
      # for canonical/OG/JSON-LD URLs. Code already defaults to this domain; set
      # explicitly per the SEO deployment guide so canonical links are unambiguous.
      - key: VITE_APP_URL
        value: https://acetoursvanuatu.com
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "no-reply@acetoursvanuatu.com"
      - key: BUSINESS_EMAIL
        value: "acetoursvanuatu@outlook.com"
      - key: BUSINESS_PHONE
        value: "+678 7114045"
      - key: WHATSAPP_NUMBER
        value: "6787114045"
      - key: ADMIN_EMAIL
        sync: false # Admin notification email address
      - key: SMS_PROVIDER
        value: console # Change to android_gateway or twilio when ready
      - key: SMS_ADMIN_PHONE
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENTS_STRIPE_MODE
        value: sandbox
