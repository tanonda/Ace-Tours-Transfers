services:
  - type: web
    name: ace-tours-vanuatu
    env: node
    plan: starter # Starter plan recommended for always-on background workers
    healthCheckPath: /api/health
    # Install Chromium for the build-time SEO prerender step (scripts/prerender.ts)
    # before building. The browser install is wrapped so it can NEVER fail the
    # deploy: try with system deps, fall back to a plain browser download, else
    # continue — prerender is non-fatal, so worst case we ship the SPA shell.
    buildCommand: npm install --include=dev --legacy-peer-deps && (npx playwright install --with-deps chromium || npx playwright install chromium || true) && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Connect Neon DB URL here
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://ace-tours-transfers.onrender.com
      # Build-time var baked into the Vite client (import.meta.env.VITE_APP_URL)
      # for canonical/OG/JSON-LD URLs. Code already defaults to this domain; set
      # explicitly per the SEO deployment guide so canonical links are unambiguous.
      - key: VITE_APP_URL
        value: https://acetoursvanuatu.com
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "no-reply@acetoursvanuatu.com"
      - key: BUSINESS_EMAIL
        value: "acetoursvanuatu@outlook.com"
      - key: BUSINESS_PHONE
        value: "+678 7114045"
      - key: WHATSAPP_NUMBER
        value: "6787114045"
      - key: ADMIN_EMAIL
        sync: false # Admin notification email address
      - key: SMS_PROVIDER
        value: console # Change to android_gateway or twilio when ready
      - key: SMS_ADMIN_PHONE
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENTS_STRIPE_MODE
        value: sandbox
