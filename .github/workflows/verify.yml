name: Verify Production Readiness
run-name: Verify Production Readiness by @${{ github.actor }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: acetours_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        # PRERENDER=0: skip the runtime browser-prerender step in CI. Prerender needs a
        # live DATABASE_URL + a Chromium binary (neither present in this job) and is a
        # runtime snapshot step, not a compile check — Render runs the real prerender at
        # container startup. This matches the Dockerfile (`RUN PRERENDER=0 npm run build`)
        # and keeps CI fast and deterministic. The build still validates client+server compilation.
        run: PRERENDER=0 npm run build

      - name: Verify Architecture & Invariants
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/acetours_test
          SESSION_SECRET: ci-test-session-secret-that-is-at-least-32-characters-long
        run: npm run check-architecture

      - name: Run Go-Live Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/acetours_test
          SESSION_SECRET: ci-test-session-secret-that-is-at-least-32-characters-long
        run: npm run go-live-verify
