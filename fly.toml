app = "ace-tours-vanuatu"
primary_region = "syd" # Sydney is closest to Vanuatu

[build]
  [build.args]
    NODE_VERSION = "20"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false # Keep it always-on for background workers
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512

[env]
  NODE_ENV = "production"
  PORT = "5000"
  PAYMENTS_STRIPE_MODE = "sandbox"
